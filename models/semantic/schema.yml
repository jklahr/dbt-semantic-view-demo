version: 2

models:
  - name: sales_analytics_sv
    description: >
      Semantic view over order_summary and stg_customers providing revenue,
      order count, and product analytics with declarative materializations.
    tests:
      # Verify materializations exist and are active after deployment
      - dbt_semantic_view.materialization_exists:
          materialization_name: revenue_by_region_month
      - dbt_semantic_view.materialization_is_active:
          materialization_name: revenue_by_region_month
      - dbt_semantic_view.materialization_exists:
          materialization_name: revenue_by_segment

